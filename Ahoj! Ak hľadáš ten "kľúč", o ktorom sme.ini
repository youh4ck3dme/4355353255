Ahoj! Ak hľadáš ten "kľúč", o ktorom sme hovorili, konkrétne reCAPTCHA Enterprise site key , ten získaš v Google Cloud Console .
Postup je nasledovný:
Prihlás sa do Google Cloud Console: Použi ten istý Google účet, s ktorým máš prepojený svoj Firebase projekt (studio-6196097112-43509).
Vyber svoj projekt: V hornej lište Google Cloud Console sa uisti, že máš vybraný správny projekt "VIandMO" (ID: studio-6196097112-43509 ).
Prejdi na reCAPTCHA Enterprise: V ľavom navigačnom menu vyhľadaj a klikni na "Security" a potom "reCAPTCHA Enterprise". Ak ho tam nevidíš priamo, môžeš použiť vyhľadávací panel v hornej časti.
Povoľ API (ak je potrebné): Ak si reCAPTCHA Enterprise ešte nepoužíval, môže sa zobraziť výzva na povolenie API. Urob tak.
Vytvor kľúč: Klikni na "CREATE KEY" (alebo podobné tlačidlo).
Vyber typ platformy: Zvoľ "Website" (Webová stránka).
Zadaj Názov: Daj mu nejaký popisný názov, napríklad "Bratislava Sťahovanie Web App".
Pridaj domény: Sem je veľmi dôležité pridať domény, na ktorých bude tvoja PWA bežať. Určite tam pridaj tvoju predvolenú doménu z Firebase App Hosting: studio--studio-6196097112-43509.us-central1.hosted.app . Ak budeš mať neskôr vlastné domény, pridáš ich sem tiež.
Nastav "Use checkbox challenge": Pre reCAPTCHA Enterprise v3, ako sme si povedali, nechaj túto možnosť NEZAŠKRTNUTÚ , aby bola reCAPTCHA neviditeľná pre používateľa.
Vytvor kľúč.
Po vytvorení sa ti zobrazí Site Key (niekedy nazývaný aj "kľúč webovej stránky"). Tento kľúč potom použiješ vo svojej Next.js PWA na frontende a tiež ho zadáš do Firebase Console v nastaveniach App Check pre tvoju webovú aplikáciu.
Nezabudni, že pre verifikáciu na backende (Next.js API route alebo Cloud Function) budeš potrebovať aj projektové credentials (typicky service account key) pre Google Cloud, ale "site key" je to, čo ide do frontendu a do App Checku.